<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cadastro — ONG Exemplo</title>
  <meta name="description" content="Formulário de cadastro para voluntários e doadores.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
  <header class="site-header" role="banner">
    <div class="container">
      <img src="images/logo.png" alt="Logotipo da ONG Exemplo" class="logo">
      <nav aria-label="Menu principal">
        <ul class="nav">
          <li><a href="index.html">Início</a></li>
          <li><a href="projetos.html">Projetos</a></li>
          <li><a href="cadastro.html">Cadastro</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="container" role="main">
    <h1>Cadastro</h1>
    <p>Preencha seus dados para se candidatar a vagas de voluntariado ou se tornar um doador.</p>
    <form id="form-cadastro" novalidate>
      <fieldset>
        <legend>Dados pessoais</legend>
        <label for="nome">Nome completo *</label>
        <input id="nome" name="nome" type="text" required minlength="3" aria-required="true">
        <label for="email">E‑mail *</label>
        <input id="email" name="email" type="email" required aria-required="true">
        <label for="cpf">CPF *</label>
        <input id="cpf" name="cpf" type="text" inputmode="numeric" required aria-required="true" maxlength="14" placeholder="000.000.000-00">
        <label for="telefone">Telefone</label>
        <input id="telefone" name="telefone" type="tel" inputmode="tel" maxlength="15" placeholder="(00) 00000-0000">
        <label for="data-nasc">Data de nascimento</label>
        <input id="data-nasc" name="data-nasc" type="date" max="2007-12-31">
      </fieldset>
      <fieldset>
        <legend>Endereço</legend>
        <label for="cep">CEP *</label>
        <input id="cep" name="cep" type="text" maxlength="9" placeholder="00000-000" required>
        <label for="endereco">Endereço</label>
        <input id="endereco" name="endereco" type="text">
        <label for="cidade">Cidade</label>
        <input id="cidade" name="cidade" type="text">
        <label for="estado">Estado</label>
        <select id="estado" name="estado">
          <option value="">Selecione</option>
          <option value="SP">SP</option>
          <option value="RJ">RJ</option>
        </select>
      </fieldset>
      <fieldset>
        <legend>Preferências</legend>
        <label><input type="checkbox" name="newsletter" value="sim"> Quero receber newsletter</label>
      </fieldset>
      <p><button type="submit" class="btn">Enviar cadastro</button></p>
      <div id="msg-erro" role="alert" aria-live="assertive" hidden></div>
    </form>
  </main>
  <footer role="contentinfo" class="site-footer">
    <div class="container">
      <p>&copy; ONG Exemplo</p>
    </div>
  </footer>
  <script src="js/main.js" defer></script>
</body>
</html>
